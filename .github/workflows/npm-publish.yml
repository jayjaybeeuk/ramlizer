# This workflow runs tests and publishes to npm and GitHub Packages when merged to main/master or on release.

name: Publish Package

on:
  push:
    branches: [master, main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm if version is new
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "${PACKAGE_NAME}@${CURRENT_VERSION}" version 2>/dev/null || true)
          if [ "$CURRENT_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Publishing ${PACKAGE_NAME}@${CURRENT_VERSION} to npm..."
            npm publish
          else
            echo "Version ${CURRENT_VERSION} of ${PACKAGE_NAME} is already published on npm. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token || secrets.NPM_TOKEN }}

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_NAME" != @* ]]; then
            echo "Skipping GitHub Packages publish: package name '$PACKAGE_NAME' is not scoped (@owner/package). GitHub Packages requires scoped package names."
          else
            npm publish || echo "GitHub Packages publish skipped or failed"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
